name: Test and publish JARVIS (llm-index)

on:
  push:
    branches: [llm-index]
  workflow_dispatch:

concurrency:
  group: publish-llm-index
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit and HTTP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: node --check web/app.js
      - run: node --check web/research-ui.js
      - run: node --check web/voice.js
      - run: node --test tests/voice.test.cjs
      - run: python -m unittest discover -s tests -v
      - run: python -m evaluation.benchmark --dataset evaluation/toy_cases.jsonl
      - run: python -m evaluation.graph_benchmark --dataset evaluation/graph_cases.jsonl --assert-pass

  publish:
    needs: test
    name: Publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [llm, research, gateway, searxng]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.component }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/articles-llm-index-${{ matrix.component }}:latest
            ghcr.io/${{ github.repository_owner }}/articles-llm-index-${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
