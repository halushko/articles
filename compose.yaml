services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-segmenter}
      POSTGRES_USER: ${POSTGRES_USER:-segmenter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-segmenter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-segmenter}
      EXAMPLE_DOCS_DIR: /app/examples/access_recovery_source_docs
      CONTROL_PROCESS_PATH: /app/examples/access_recovery_process.md
      PROCESS_MODEL_MODE: ${PROCESS_MODEL_MODE:-llm}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-5-mini}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-120000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-12000}
      LLM_RESPONSE_FORMAT: ${LLM_RESPONSE_FORMAT:-json_schema}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      MAX_ARCHIVE_BYTES: 20971520
      MAX_UNCOMPRESSED_BYTES: 52428800
      MAX_DOCUMENTS: 100
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
