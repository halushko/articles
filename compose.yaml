services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-segmenter}
      POSTGRES_USER: ${POSTGRES_USER:-segmenter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-segmenter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-segmenter}
      EXAMPLE_DOCS_DIR: /app/examples/access_recovery_source_docs
      MAX_ARCHIVE_BYTES: 20971520
      MAX_UNCOMPRESSED_BYTES: 52428800
      MAX_DOCUMENTS: 100
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
