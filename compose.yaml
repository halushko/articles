services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - models:/root/.ollama
    networks: [model_net]
  model-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: ${MODEL:-qwen3:4b}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for i in $(seq 1 120); do
          if ollama list >/dev/null 2>&1; then
            ollama show "$MODEL" >/dev/null 2>&1 || ollama pull "$MODEL"
            exit 0
          fi
          sleep 2
        done
        echo "Ollama not ready" >&2
        exit 1
    networks: [model_net]
    depends_on: [ollama]
  agent:
    build:
      context: .
      args: {SERVICE: agent}
    environment:
      OLLAMA_URL: http://ollama:11434
      MODEL: ${MODEL:-qwen3:4b}
    networks: [model_net, agent_net]
    depends_on:
      model-init:
        condition: service_completed_successfully
  world:
    build:
      context: .
      args: {SERVICE: world}
    environment:
      WORLDS_DIR: /worlds
    volumes:
      - ./worlds:/worlds:ro
    networks: [world_net]
  laboratory:
    build:
      context: .
      args: {SERVICE: laboratory}
    environment:
      WORLD_URL: http://world:8000
      AGENT_URL: http://agent:8000
      DB_PATH: /data/lab.sqlite3
      MODEL: ${MODEL:-qwen3:4b}
    volumes:
      - experience:/data
    ports:
      - "127.0.0.1:8765:8000"
    networks: [world_net, agent_net, ui_net]
    depends_on: [agent, world]
networks:
  model_net: {}
  agent_net: {internal: true}
  world_net: {internal: true}
  ui_net: {}
volumes:
  models:
  experience:
